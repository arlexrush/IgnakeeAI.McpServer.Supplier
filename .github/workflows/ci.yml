name: CI - Build & Test

on:
  push:
    branches: [develop, staged, master]
  pull_request:
    branches: [develop, staged, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore IgnakeeAI.McpServer.Supplier.sln

      - name: Build
        run: dotnet build IgnakeeAI.McpServer.Supplier.sln -c Release --no-restore

      - name: Test
        run: dotnet test IgnakeeAI.McpServer.Supplier.sln -c Release --no-build --verbosity normal