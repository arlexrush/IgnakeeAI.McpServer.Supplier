name: CD - Build, Publish & Deploy

on:
  push:
    branches: [develop, staged, master]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: arlexrush/mcp-supplier-server

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore IgnakeeAI.McpServer.Supplier.sln

      - name: Build
        run: dotnet build IgnakeeAI.McpServer.Supplier.sln -c Release --no-restore

      - name: Test
        run: dotnet test IgnakeeAI.McpServer.Supplier.sln -c Release --no-build --verbosity normal

  publish-image:
    name: Publish Docker image
    needs: quality-gate
    runs-on: ubuntu-latest

    outputs:
      image-tag: sha-${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/IgnakeeAI.McpServer.Supplier.Api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ github.ref_name == 'master' && format('{0}/{1}:latest', env.REGISTRY, env.IMAGE_NAME) || '' }}

  deploy:
    name: Deploy
    needs: publish-image
    if: github.ref_name == 'staged' || github.ref_name == 'master'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'master' && 'production' || github.ref_name }}

    steps:
      - name: Determine deployment configuration
        id: deployment
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            staged)
              echo "aspnetcore_environment=Staging" >> "$GITHUB_OUTPUT"
              echo "environment_file=.env.staged" >> "$GITHUB_OUTPUT"
              ;;
            master)
              echo "aspnetcore_environment=Production" >> "$GITHUB_OUTPUT"
              echo "environment_file=.env.production" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported branch: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull and restart service
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE_TAG: ${{ needs.publish-image.outputs.image-tag }}
          ASPNETCORE_ENVIRONMENT: ${{ steps.deployment.outputs.aspnetcore_environment }}
          ENVIRONMENT_FILE: ${{ steps.deployment.outputs.environment_file }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && \
             IMAGE_TAG='${IMAGE_TAG}' \
             ASPNETCORE_ENVIRONMENT='${ASPNETCORE_ENVIRONMENT}' \
              COMPOSE_ENV_FILE='${ENVIRONMENT_FILE}' \
             docker compose \
               --env-file '${ENVIRONMENT_FILE}' \
               -f docker-compose.production.yml \
               pull && \
             IMAGE_TAG='${IMAGE_TAG}' \
             ASPNETCORE_ENVIRONMENT='${ASPNETCORE_ENVIRONMENT}' \
              COMPOSE_ENV_FILE='${ENVIRONMENT_FILE}' \
             docker compose \
               --env-file '${ENVIRONMENT_FILE}' \
               -f docker-compose.production.yml \
               up -d --remove-orphans"