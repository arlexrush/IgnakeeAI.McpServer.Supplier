services:
  api:
    image: ghcr.io/arlexrush/mcp-supplier-server:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    env_file:
      - ${COMPOSE_ENV_FILE:-.env.production}
    ports:
      - "5100:5100"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:?ASPNETCORE_ENVIRONMENT is required}
      ASPNETCORE_URLS: http://+:5100
      DatabaseProvider: postgresql
      Database__ApplyMigrationsOnStartup: ${DATABASE_APPLY_MIGRATIONS_ON_STARTUP:-true}
      ConnectionStrings__Catalog: Host=postgres;Port=5432;Database=${POSTGRES_DB:?POSTGRES_DB is required};Username=${POSTGRES_USER:?POSTGRES_USER is required};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      Admin__ApiKey: ${ADMIN_API_KEY:?ADMIN_API_KEY is required}
      Mcp__ContractVersion: ${MCP_CONTRACT_VERSION:-1.0.0}
      Mcp__ProtocolVersion: ${MCP_PROTOCOL_VERSION:-2025-03-26}
      Mcp__Clients__0__ClientId: ${MCP_CLIENT_ID:?MCP_CLIENT_ID is required}
      Mcp__Clients__0__ApiKey: ${MCP_API_KEY:?MCP_API_KEY is required}
      Mcp__Clients__0__Scopes__0: catalog.read
      Mcp__Clients__0__Scopes__1: availability.read
      SUPPLIER_VENDOR_NAME: ${SUPPLIER_VENDOR_NAME:?SUPPLIER_VENDOR_NAME is required}
      SUPPLIER_CONTACT_EMAIL: ${SUPPLIER_CONTACT_EMAIL:?SUPPLIER_CONTACT_EMAIL is required}
      SUPPLIER_CONTACT_PHONE: ${SUPPLIER_CONTACT_PHONE:?SUPPLIER_CONTACT_PHONE is required}
      SUPPLIER_CONTACT_ADDRESS: ${SUPPLIER_CONTACT_ADDRESS:?SUPPLIER_CONTACT_ADDRESS is required}
      SUPPLIER_BUSINESS_HOURS: ${SUPPLIER_BUSINESS_HOURS:?SUPPLIER_BUSINESS_HOURS is required}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:5100/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - supplier_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  supplier_postgres_data:
